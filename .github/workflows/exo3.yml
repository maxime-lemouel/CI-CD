name: exo 3

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement de déploiement"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: application
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22]
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: application
          path: dist/

      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application
          path: dist/

      - name: Afficher API_URL
        run: echo "API_URL = $API_URL"
        env:
          API_URL: ${{ vars.API_URL }}

      - name: Résumé du déploiement
        env:
          TARGET: ${{ inputs.environment }}
          API_URL: ${{ vars.API_URL }}
        run: |
          echo "## Déploiement" >> $GITHUB_STEP_SUMMARY
          echo "- Cible : $TARGET" >> $GITHUB_STEP_SUMMARY
          echo "- URL : $API_URL" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY